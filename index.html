<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCalcul Express</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Variables pour les thèmes */
        :root {
            --bg: #f8fafc;
            --text: #1e293b;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --border: #cbd5e1;
            --input-bg: #ffffff;
        }

        body.dark-mode {
            --bg: #0f172a;
            --text: #f1f5f9;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --border: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Style du bouton bascule de thème moderne */
        .theme-toggle-btn {
            background: none;
            border: 2px solid var(--border);
            border-radius: 20px;
            width: 50px;
            height: 26px;
            position: relative;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        .theme-toggle-btn::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background-color: var(--primary);
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        body.dark-mode .theme-toggle-btn::after {
            transform: translateX(24px);
        }

        /* Style général des conteneurs de calcul */
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background-color: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }

        button.calc-btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Barre de menu supérieure -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border);">
        <h3 style="margin: 0; font-size: 18px;">MediCalcul Express</h3>
        <!-- Bouton menu hamburger -->
        <button onclick="toggleMenu()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text);">☰</button>
    </header>

    <!-- Panneau du menu latéral (caché par défaut) -->
    <div id="sideMenu" style="position: fixed; top: 0; right: -250px; width: 250px; height: 100%; background: var(--card-bg); box-shadow: -4px 0 10px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 2000; padding: 20px; border-left: 1px solid var(--border); box-sizing: border-box;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h4 style="margin: 0;">Paramètres</h4>
            <button onclick="toggleMenu()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text);">✕</button>
        </div>
        
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <span>Mode Sombre</span>
            <!-- Interrupteur du mode sombre -->
            <button class="theme-toggle-btn" onclick="toggleDarkMode()"></button>
        </div>
    </div>

    <!-- Contenu principal -->
    <div class="container">
        <h2 style="text-align: center; margin-top: 0;">MediCalcul Express</h2>
        <p style="text-align: center; color: var(--border);">Outils de calculs médicaux rapides</p>

        <!-- Exemple de calculatrice IMC -->
        <h3>Calcul de l'IMC (Indice de Masse Corporelle)</h3>
        <label for="poids">Poids (kg)</label>
        <input type="number" id="poids" placeholder="Ex: 70">

        <label for="taille">Taille (cm)</label>
        <input type="number" id="taille" placeholder="Ex: 175">

        <button class="calc-btn" onclick="calculerIMC()">Calculer l'IMC</button>
        <div id="resultatIMC" style="margin-top: 15px; font-weight: bold;">Résultat : --</div>
    </div>

    <!-- Scripts JavaScript -->
    <script>
        // Fonction pour ouvrir/fermer le menu latéral
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            if (menu.style.right === '0px') {
                menu.style.right = '-250px';
            } else {
                menu.style.right = '0px';
            }
        }
    </script>

    <script>
        // Fonction pour basculer le mode sombre
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }

        // Restaure la préférence de l'utilisateur au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }
        });
    </script>
</body>
</html>
